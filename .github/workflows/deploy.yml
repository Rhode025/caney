name: Build and deploy

# Builds the site from live data and publishes it to Cloudflare Pages over HTTPS.
#
# The cache step is load-bearing, not an optimisation. briefing.py keeps a last-good
# Center Hill release forecast in cache_dam.json and falls back to it when USACE CWMS is
# thin or down (briefing.py:80-89). cache_dam.json is gitignored, so a cold runner would
# build an empty forecast during an outage and the "USING CACHED release data" path would
# never fire. Persisting it across runs preserves that resilience in CI.
#
# §49: static verify.py is NOT sufficient on its own any more. The planner is an
# interactive browser application, so the browser suite and the accessibility check gate
# the deploy alongside the static checks. Everything runs before `pages deploy`.

on:
  push:
    branches: [master]
  schedule:
    - cron: '5 * * * *'    # hourly, UTC.
    # GitHub delays scheduled workflows under load and drops them outright when backed up:
    # observed 18:00 -> ran 19:44, 21:00 -> ran 22:11, 00:00 -> never fired. Asking hourly
    # means a skipped or late run costs ~1 h of staleness instead of 6+. Offset :05 to
    # avoid the top-of-hour rush, which is when GitHub's scheduler is most congested.
  workflow_dispatch:

# Never let a scheduled build race a push build; they write the same out/.
concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No requirements.txt on purpose: every generator, and the whole caney/ package,
          # is stdlib only.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── gate 1: unit tests and model fixtures. No network, no browser, no build. ──
      # These run FIRST so a broken scorer fails in seconds instead of after a 60-second
      # build and a browser download.
      - name: Planner unit tests, schemas and model fixtures
        run: python3 test/planner/run.py

      - name: Secret scan
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!test/vendor-axe.js' ':!*/node_modules/*'; then
            echo "::error::a credential-shaped literal is committed"
            exit 1
          fi
          echo "no credential literals found"

      # The 3.0 frontend. Installed before the build because build.sh only builds the app
      # when web-v3/node_modules exists — that guard keeps build.sh working on a machine
      # with no npm, and in CI we always want the app.
      - name: Install the app toolchain
        run: cd web-v3 && npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Restore release cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache_dam.json
            .cache
          key: cache-dam-${{ github.run_id }}
          restore-keys: cache-dam-

      - name: Build site
        run: ./build.sh
        env:
          # roadmap.py reads the roadmap issues to decide which tickets are shipped.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # §17 — optional. With neither set the planner is fully deterministic and every
          # check below still passes; the research drawer simply says research is off.
          RESEARCH_ENABLED: ${{ vars.RESEARCH_ENABLED }}
          # Preferred: the Research Intelligence worker holds the key, the cache, the decay
          # curves and the spend cap. Falls back to a direct OpenAI call when only the
          # secret is set, and to no research at all when neither is (§17, §63).
          CANEY_RESEARCH_ENDPOINT: ${{ vars.CANEY_RESEARCH_ENDPOINT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL }}

      # Saving right after the build, with if: always(), keeps the CWMS fallback intact
      # regardless of what QA decides — actions/cache's post-step save is SKIPPED when an
      # earlier step fails, which would throw away a perfectly good release forecast.
      - name: Save release cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache_dam.json
            .cache
          key: cache-dam-${{ github.run_id }}

      # ── gate 2: static QA over the built site ──
      - name: Static QA
        run: python3 test/verify.py

      - name: River QC
        run: python3 test/qc_rivers.py

      # ── gate 3: the browser suites ──
      - name: Install browser test deps
        run: |
          cd test && npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Python↔browser scoring parity
        run: node test/planner/test_parity.mjs

      - name: Research worker (tiering, decay, normalisation, dedupe)
        run: cd research-worker && node test.mjs

      - name: RiverGuide (slicer, access, fail-closed guard, itinerary integration)
        run: cd riverguide && node test.mjs

      - name: Runtime QA — river pages
        run: cd test && node browser.mjs

      - name: Runtime QA — planner, six scenarios, axe accessibility
        run: cd test && node planner.mjs

      - name: Show release-cache state
        if: always()
        run: |
          if [ -f cache_dam.json ]; then
            python3 -c "import json;print('cache_dam.json ts:', json.load(open('cache_dam.json')).get('ts'))"
          else
            echo "::warning::cache_dam.json missing after build — CWMS fallback is unavailable next run"
          fi

      - name: Build report
        if: always()
        run: |
          if [ -f out/plan/build.json ]; then python3 -m json.tool out/plan/build.json; fi

      # ── deploy ──
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=caney --branch=master

      # ── gate 4: post-deploy smoke and freshness ──
      # The deploy can succeed and still serve a stale or broken page. This asks the LIVE
      # site the questions a reader would: is it up, is it secure, is the planner data
      # fresh, does the homepage still ask what you want to catch.
      - name: Post-deploy smoke and freshness
        run: cd test && node smoke.mjs && node planner-smoke.mjs

  # ── the API's conditions, refreshed independently of everything above ──────
  #
  # THIS USED TO BE A STEP IN build-deploy AND THAT WAS WRONG. It sat after the test
  # gates, so when a unit test failed at 00:05Z every later step was SKIPPED — including
  # this one — and `continue-on-error` cannot save a step that never runs. That night all
  # three refresh paths failed at once: the Worker cron had stopped, GitHub's schedule on
  # refresh.yml had fired once in two hours, and this was skipped behind a broken test.
  # The API served data 110 minutes old.
  #
  # A failing test must stop the DEPLOY — never publish a bad build — and must not stop the
  # API's data refreshing. Those are unrelated concerns and they do not belong in one job.
  # `needs:` is deliberately absent.
  refresh-api:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the API's conditions if they are behind
        continue-on-error: true
        run: python3 tools/refresh_api.py --stale-after 1800
