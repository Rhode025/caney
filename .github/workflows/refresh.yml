name: Refresh conditions

# §12 — keep the API's snapshot bundle current.
#
# The Worker's own cron trigger is registered (`schedule: */5 * * * *`, printed on every
# deploy) and does not run: bundle age was sampled growing linearly at 865s, 966s, 1067s
# with no error in any log, and it stayed dead after the build was made cheap enough to
# fit inside one invocation. A self-addressed fetch from inside the Worker does not land
# either — it is issued on every stale request and the shard never refreshes.
#
# An EXTERNAL POST to /internal/rebuild does work: 23 of 23 sources in 2.3 seconds,
# measured. The property that matters is that each call is a separate invocation with its
# own CPU and subrequest budget, which is precisely what waitUntil never provided.
#
# Every ten minutes, all three shards. GitHub delays scheduled workflows under load — this
# repo already documents that, which is why the site build asks hourly rather than
# three-hourly — so a skipped run costs staleness rather than leaving a third of the water
# behind.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: caney-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild every shard
        run: python3 tools/refresh_api.py
