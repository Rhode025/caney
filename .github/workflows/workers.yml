name: Workers

# Caney 3.0 (§96-§98) deploys two Workers alongside the Pages site:
#
#   caney-research   the Research Intelligence service (§34, §97)
#   caney-api        the canonical Python planner API (§4, §98)
#
# Both need CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, which live as repository
# secrets and are NOT available on a developer machine. That is why deployment is a
# workflow rather than a script someone runs locally.
#
# `probe` exists because a token scoped only for Pages will fail every Worker step with
# an authentication error that reads like a bug. Run it first; it prints exactly what
# the token may do.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "probe | bootstrap | deploy-research | deploy-api | deploy-all"
        required: true
        default: probe
        type: choice
        options: [probe, bootstrap, deploy-research, deploy-api, deploy-all, tail]
      minutes:
        description: "tail only: how long to stream logs (default 7, enough for one cron)"
        required: false
        default: "7"

concurrency:
  group: caney-workers
  cancel-in-progress: false

jobs:
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Token identity and scope
        run: |
          echo "::group::whoami"
          npx --yes wrangler@4 whoami || echo "whoami failed (exit $?)"
          echo "::endgroup::"

      - name: Capability probe
        if: ${{ inputs.action == 'probe' || inputs.action == 'bootstrap' }}
        run: |
          set +e
          api() { curl -s -o /tmp/r.json -w "%{http_code}" \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$1"; }
          for ep in "workers/scripts" "d1/database" "storage/kv/namespaces" "pages/projects"; do
            code=$(api "$ep")
            printf '%-26s HTTP %s  %s\n' "$ep" "$code" \
              "$(python3 -c 'import json,sys;d=json.load(open("/tmp/r.json"));print("ok" if d.get("success") else (d.get("errors") or [{}])[0].get("message",""))' 2>/dev/null)"
          done
          echo
          echo "A 200 on workers/scripts, d1/database and storage/kv/namespaces means the"
          echo "token can deploy Caney 3.0 end to end. A 403 names the missing permission."

      # ── bootstrap ────────────────────────────────────────────────────────
      # KV namespaces are created once and their ids written into the wrangler files.
      # D1 is attempted and expected to fail on the current token (401); the step reports
      # that rather than failing the run, because everything else can proceed without it.
      - name: Create KV namespaces
        if: ${{ inputs.action == 'bootstrap' }}
        run: |
          set -e
          mk() {
            echo "::group::KV $1"
            out=$(npx --yes wrangler@4 kv namespace create "$1" 2>&1) || true
            echo "$out"
            echo "$out" | grep -oE 'id = "[0-9a-f]{32}"' | head -1 ||             echo "$out" | grep -oE '"id": "[0-9a-f]{32}"' | head -1 || true
            echo "::endgroup::"
          }
          mk CACHE
          mk PLANS
          echo
          echo "Copy each id into the matching wrangler.toml and commit."

      - name: Try D1
        if: ${{ inputs.action == 'bootstrap' }}
        run: |
          npx --yes wrangler@4 d1 create caney-research 2>&1 | tail -20 ||             echo "D1 unavailable with this token — see DEPLOYMENT.md"

      # ── research worker ──────────────────────────────────────────────────
      - name: Deploy caney-research
        if: ${{ inputs.action == 'deploy-research' || inputs.action == 'deploy-all' }}
        working-directory: research-worker
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tail -30

      # ── api worker ───────────────────────────────────────────────────────
      # §4 — the planner package is COPIED in, never checked in. A bundler needs every
      # module beside the entry point; a second editable copy in the repo is how two
      # implementations of one number appear.
      - name: Vendor the planner package
        if: ${{ inputs.action == 'deploy-api' || inputs.action == 'deploy-all' }}
        run: |
          rm -rf caney-api/src/caney
          cp -R caney caney-api/src/caney
          find caney-api/src/caney -name '__pycache__' -type d -exec rm -rf {} + || true
          echo "vendored $(find caney-api/src/caney -name '*.py' | wc -l) modules, $(du -sh caney-api/src/caney | cut -f1)"

      - name: Deploy caney-api
        if: ${{ inputs.action == 'deploy-api' || inputs.action == 'deploy-all' }}
        working-directory: caney-api
        run: |
          # Stamp the commit into the worker so /health can report what is actually live.
          # The live API lagged the repo by twenty minutes once because deploy.yml
          # publishes Pages only and this workflow has to be dispatched separately.
          npx --yes wrangler@4 deploy --var BUILD_SHA:"$GITHUB_SHA" 2>&1 | tail -40

      - name: Smoke the deployments
        if: ${{ startsWith(inputs.action, 'deploy') }}
        run: |
          set +e
          for host in caney-api caney-research; do
            url="https://$host.$(npx --yes wrangler@4 whoami 2>/dev/null | grep -oE '[a-z0-9-]+\.workers\.dev' | head -1)"
            echo "— $host —"
          done
          echo "Smoke runs from the post-deploy workflow; see DEPLOYMENT.md for URLs."

      # ── tail ─────────────────────────────────────────────────────────────
      # The diagnostic for #165, and the reason it took too long to run: I kept saying
      # `wrangler tail` needed credentials I did not have. It needs exactly the
      # credentials this workflow already uses to deploy. The logs are not reachable from
      # a developer machine; they are reachable from here.
      #
      # Streams for seven minutes by default, which covers at least one */5 cron window.
      # A scheduled invocation appears as an event of type "scheduled"; its absence over
      # two windows is evidence the scheduler is not invoking the worker at all, as
      # distinct from invoking it and failing.
      - name: Tail the API worker
        if: ${{ inputs.action == 'tail' }}
        working-directory: caney-api
        run: |
          set +e
          MIN="${{ inputs.minutes }}"
          MIN="${MIN:-7}"
          echo "streaming $MIN minutes — a */5 cron should appear at least once"
          timeout "${MIN}m" npx --yes wrangler@4 tail --format json 2>&1 | tee /tmp/tail.log
          echo "── summary ──"
          python3 ../tools/tail_summary.py /tmp/tail.log
